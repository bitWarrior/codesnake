[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codesnake"
dynamic = ["version"]
description = "Semantic code checker for Python 3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "CodeSnake Contributors" },
]
keywords = ["linter", "static-analysis", "ast", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Runtime: stdlib only (ast, argparse, json, pathlib, dataclasses).
dependencies = []

[project.optional-dependencies]
tools = [
    "bandit>=1.9.3",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
]
dev = [
    "codesnake[tools]",
]

[project.urls]
Homepage = "https://github.com/bitWarrior/codesnake"
Repository = "https://github.com/bitWarrior/codesnake"
Issues = "https://github.com/bitWarrior/codesnake/issues"

[project.scripts]
codesnake = "codesnake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "codesnake._version.__version__" }
