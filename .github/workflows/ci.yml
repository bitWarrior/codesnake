name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deny by default; each job grants only what it needs.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to a commit SHA: a tag is a mutable ref, and whoever
      # can move it can run arbitrary code in this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the job token in .git/config for later steps to reuse.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Self-check (annotations appear on the PR)
        run: codesnake check --format github --no-color src/
