name: Release

on:
  release:
    types: [published]

# Deny by default; each job grants only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify the built version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BUILT=$(python -c "import sys; sys.path.insert(0, 'src'); from codesnake._version import __version__; print(__version__)")
          echo "tag=$TAG built=$BUILT"
          if [ "$TAG" != "v$BUILT" ]; then
            echo "::error::Release tag $TAG does not match _version.py ($BUILT); refusing to publish."
            exit 1
          fi

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Gated: this environment requires a human to approve the deployment, so a
    # tag push alone cannot ship a release.
    environment:
      name: pypi
      url: https://pypi.org/p/codesnake
    permissions:
      # OIDC for PyPI Trusted Publishing. There is no API token to steal.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
