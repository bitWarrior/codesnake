name: Release

on:
  release:
    types: [published]
  # A release event does not always dispatch a run, and a failed publish should
  # not require recreating the GitHub Release. Both paths use the same guard.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.2.0 (must match src/codesnake/_version.py)"
        required: true
        type: string

# Deny by default; each job grants only what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tag being released, never whatever the default branch is at.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          # Full history so the tagged commit can be checked against main below.
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse to publish a commit that is not on main
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Branch protection governs main, not tags. Without this, anyone who can
          # push a tag and publish a Release can ship a commit that never passed
          # review -- the version guard below only checks the number, not the history.
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG points at $(git rev-parse --short HEAD), which is not reachable from main. Refusing to publish an unreviewed commit."
            exit 1
          fi
          echo "$TAG is on main ($(git rev-parse --short HEAD))"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Verify the built version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          BUILT=$(python -c "import sys; sys.path.insert(0, 'src'); from codesnake._version import __version__; print(__version__)")
          echo "tag=$TAG built=$BUILT"
          if [ "$TAG" != "v$BUILT" ]; then
            echo "::error::Release tag $TAG does not match _version.py ($BUILT); refusing to publish."
            exit 1
          fi

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Gated: this environment requires a human to approve the deployment, so a
    # tag push alone cannot ship a release.
    environment:
      name: pypi
      url: https://pypi.org/p/codesnake
    permissions:
      # OIDC for PyPI Trusted Publishing. There is no API token to steal.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
